name: Publish Friday Article

on:
  schedule:
    - cron: '0 14 * * 5'  # Every Friday 2pm UTC (9am CDT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pick topic
        id: topic
        run: |
          NEXT=$(ls _scheduled/*.tsx 2>/dev/null | sort | head -1)
          if [ -n "$NEXT" ]; then
            FILENAME=$(basename "$NEXT" .tsx)
            SLUG=$(echo "$FILENAME" | sed 's/^[0-9-]*_//')
            mkdir -p "src/app/blog/$SLUG"
            mv "$NEXT" "src/app/blog/$SLUG/page.tsx"
            echo "slug=$SLUG" >> $GITHUB_OUTPUT
            echo "source=scheduled" >> $GITHUB_OUTPUT
            exit 0
          fi

          WEEK=$(date +%V | sed 's/^0*//')

          TOPICS=(
            "QR code for loyalty programs and rewards cards"
            "QR code A/B testing: how to test which link converts better"
            "QR codes for gyms and fitness centers"
            "QR code vs NFC tag: which technology should you choose"
            "How to track QR code scans and understand your analytics"
            "QR codes for trade shows and conferences"
            "QR codes on product labels: food, beverage, and packaging guide"
            "QR code security: how to protect your codes from tampering"
            "QR codes in healthcare: patient forms, wayfinding, and appointment links"
            "QR codes for hotels and hospitality"
            "QR code design principles: colors, logos, and what affects scan rates"
            "QR codes for retail stores: from window displays to price tags"
            "How to create a QR code for a PDF document"
            "QR codes for apartment and property management"
            "QR codes for car dealerships and automotive businesses"
            "How QR codes work: the technical explanation for non-engineers"
            "QR codes for weddings: RSVP, seating, and thank-you cards"
            "QR codes for construction and job sites"
            "QR codes for schools and education"
            "QR codes for veterinarians and pet care businesses"
            "QR code analytics: what scan data actually tells you"
            "QR codes for musicians and bands: linking to Spotify, merch, and bookings"
            "QR codes for food trucks and mobile businesses"
            "QR codes for legal offices and law firms"
            "QR codes in manufacturing: asset tracking and maintenance logs"
            "How to make a QR code for Instagram, TikTok, and social media"
            "QR codes for apartment buildings: mailroom, amenities, and maintenance requests"
            "QR codes for tourism: walking tours, maps, and local guides"
            "QR code size guide: minimum size for print, fabric, and outdoor signage"
            "QR codes for spas and salons: booking links and loyalty programs"
            "How to use QR codes in email campaigns"
            "QR codes for pharmacies and medical supply companies"
            "QR codes for nonprofit fundraising campaigns"
            "QR codes for insurance agents and brokers"
            "QR codes for accountants and financial advisors"
            "How small businesses use QR codes to compete with larger chains"
            "QR codes for craft breweries, wineries, and distilleries"
            "QR codes for home services: plumbers, electricians, and contractors"
            "QR codes for childcare centers and preschools"
            "QR codes for personal trainers and health coaches"
            "QR code vs barcode: when to use each"
            "QR codes for galleries and museums"
            "QR code printing tips: what printers get right and wrong"
            "How QR code quishing attacks work and how to defend against them"
            "QR codes for inventory management in small warehouses"
            "QR codes for tutoring centers and education businesses"
            "QR codes for funeral homes and memorial services"
            "How to embed a QR code in a PDF"
            "QR codes for farmers markets and artisan vendors"
            "QR codes for dentists and dental practices"
            "QR codes for political campaigns and community organizing"
            "How to create a QR code for a Google Maps location"
          )

          IDX=$(( ($WEEK - 1) % ${#TOPICS[@]} ))
          TOPIC="${TOPICS[$IDX]}"
          SLUG=$(echo "$TOPIC" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9 ]//g' | tr ' ' '-' | sed 's/--*/-/g' | cut -c1-60)

          echo "topic=$TOPIC" >> $GITHUB_OUTPUT
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "source=generated" >> $GITHUB_OUTPUT

      - name: Generate + validate article
        if: steps.topic.outputs.source == 'generated'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOPIC: ${{ steps.topic.outputs.topic }}
          SLUG: ${{ steps.topic.outputs.slug }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY no esta seteado"
            exit 1
          fi
          TODAY=$(date +%Y-%m-%d) python3 scripts/generate_article.py

      # El gate que faltaba. Antes se commiteaba sin compilar nunca, y el
      # articulo roto llegaba a main. Si esto falla, no se pushea nada.
      - name: Build gate
        run: |
          env -u NODE_ENV npm ci
          npm run build

      - name: Commit and push
        run: |
          git config user.name "Klickify Agency Bot"
          git config user.email "info@klickifyagency.com"
          SLUG="${{ steps.topic.outputs.slug }}"
          git add "src/app/blog/$SLUG" "src/app/sitemap.ts" "src/app/blog/page.tsx"
          git add -u _scheduled 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "publish: weekly article - $SLUG"
            git push
          fi

      - name: Report failure
        if: failure()
        run: |
          echo "::error::El articulo de esta semana NO se publico. Revisar el log:"
          echo "::error::validacion rechazada, o el build no compila. Nada fue pusheado."
          ls -la _rejected_*.tsx 2>/dev/null && cat _rejected_*.tsx | head -60 || true
