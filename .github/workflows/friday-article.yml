name: Publish Friday Article

on:
  schedule:
    - cron: '15 14 * * 5'  # Friday 14:15 UTC. Tools :00, QR :15, Mortgage :30 - they share one Groq key (TPM limit)
    - cron: '15 14 * * 6'  # Saturday backup: does nothing if an article already went out since Friday
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every gate but do not push'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the Saturday guard reads this week's history

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pick topics
        id: topic
        run: |
          NEXT=$(ls _scheduled/*.tsx 2>/dev/null | sort | head -1)
          if [ -n "$NEXT" ]; then
            FILENAME=$(basename "$NEXT" .tsx)
            SLUG=$(echo "$FILENAME" | sed 's/^[0-9-]*_//')
            mkdir -p "src/app/blog/$SLUG"
            mv "$NEXT" "src/app/blog/$SLUG/page.tsx"
            echo "slug=$SLUG" >> $GITHUB_OUTPUT
            echo "source=scheduled" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Saturday backup: if an article already went in since this week's Friday
          # (the Friday run, or a manual one), do nothing.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            FRIDAY=$(date -u -d "$(( $(date -u +%u) - 5 )) days ago" +%F)
            if [ -n "$(git log --since="${FRIDAY}T00:00:00Z" --diff-filter=A --name-only --format= -- 'src/app/blog/*/page.tsx')" ]; then
              echo "::notice::an article already went out since Friday $FRIDAY, nothing to do"
              echo "source=none" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # Priority order, not a weekly rotation: the first topics that are not published
          # yet are tried. Guides that answer a real question come first; the "QR codes for
          # <industry>" posts come last because they are the pattern that produced thin pages.
          # No topic here may repeat a post that already exists (cannibalization): quishing
          # and security, analytics, packaging, email campaigns and size guides are covered.
          TOPICS=(
            "How QR codes work: the technical explanation for non-engineers"
            "QR code design principles: colors, logos, and what affects scan rates"
            "QR code printing tips: what printers get right and wrong"
            "QR code vs NFC tag: which technology should you choose"
            "QR code vs barcode: when to use each"
            "How to create a QR code for a PDF document"
            "How to create a QR code for a Google Maps location"
            "How to make a QR code for Instagram, TikTok, and social media"
            "QR code A/B testing: how to test which link converts better"
            "QR code for loyalty programs and rewards cards"
            "QR codes for gyms and fitness centers"
            "QR codes for trade shows and conferences"
            "QR codes for hotels and hospitality"
            "QR codes for retail stores: from window displays to price tags"
            "QR codes for apartment and property management"
            "QR codes for car dealerships and automotive businesses"
            "QR codes for weddings: RSVP, seating, and thank-you cards"
            "QR codes for construction and job sites"
            "QR codes for schools and education"
            "QR codes for veterinarians and pet care businesses"
            "QR codes for musicians and bands: linking to Spotify, merch, and bookings"
            "QR codes for food trucks and mobile businesses"
            "QR codes for legal offices and law firms"
            "QR codes for tourism: walking tours, maps, and local guides"
            "QR codes for craft breweries, wineries, and distilleries"
            "QR codes for farmers markets and artisan vendors"
            "QR codes for dentists and dental practices"
            "QR codes for galleries and museums"
          )

          # Up to 3 unpublished topics from the top of the list. If one is rejected, the
          # next step tries the next one in the same run: one rejection no longer costs
          # the week. A topic that is already published is skipped.
          N=${#TOPICS[@]}
          : > "$RUNNER_TEMP/candidates.tsv"
          COUNT=0
          for i in $(seq 0 $((N - 1))); do
            CAND="${TOPICS[$i]}"
            CSLUG=$(echo "$CAND" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9 ]//g' | tr ' ' '-' | sed 's/--*/-/g' | cut -c1-60)
            if [ ! -f "src/app/blog/$CSLUG/page.tsx" ]; then
              printf '%s\t%s\n' "$CSLUG" "$CAND" >> "$RUNNER_TEMP/candidates.tsv"
              COUNT=$((COUNT + 1))
              if [ $COUNT -ge 3 ]; then break; fi
            fi
          done
          if [ $COUNT -eq 0 ]; then
            echo "::error::every topic in TOPICS is already published; add new topics"
            exit 1
          fi
          cat "$RUNNER_TEMP/candidates.tsv"
          echo "source=generated" >> $GITHUB_OUTPUT

      # Groq invents data every week (author credentials, case studies with percentages,
      # competitor limits, features the site does not have). Per topic: generate and
      # validate -> fact-check -> build. Claude Code reviews the draft against
      # scripts/site_facts.md and corrects it; if problems remain after 4 passes the topic
      # is dropped. The fact-check uses the Claude subscription (token from
      # `claude setup-token`), NEVER the paid Anthropic API, so there is no
      # ANTHROPIC_API_KEY in this step. The build is the gate that used to be missing:
      # before, a broken article reached main.
      - name: Generate, fact-check, build (up to 3 topics)
        id: gen
        if: steps.topic.outputs.source == 'generated'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY is not set"
            exit 1
          fi
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::missing secret CLAUDE_CODE_OAUTH_TOKEN (claude setup-token)"
            exit 1
          fi
          npm install -g @anthropic-ai/claude-code
          env -u NODE_ENV npm ci
          # fd 3: so no command in the loop eats the list through stdin
          while IFS=$'\t' read -r SLUG TOPIC <&3; do
            echo "::group::$TOPIC"
            if TOPIC="$TOPIC" SLUG="$SLUG" TODAY=$(date +%Y-%m-%d) python3 scripts/generate_article.py \
               && SLUG="$SLUG" python3 scripts/review_article.py \
               && npm run build; then
              echo "::endgroup::"
              echo "slug=$SLUG" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::rejected: $TOPIC. Trying the next topic."
            git checkout -- src/app
            git clean -fdq -- src/app
          done 3< "$RUNNER_TEMP/candidates.tsv"
          echo "::error::none of the topics passed validation + fact-check + build"
          exit 1

      - name: Build gate (scheduled article)
        if: steps.topic.outputs.source == 'scheduled'
        run: |
          env -u NODE_ENV npm ci
          npm run build

      - name: Commit and push
        if: steps.topic.outputs.source != 'none' && !inputs.dry_run
        run: |
          git config user.name "Klickify Agency Bot"
          git config user.email "info@klickifyagency.com"
          SLUG="${{ steps.gen.outputs.slug || steps.topic.outputs.slug }}"
          git add "src/app/blog/$SLUG" "src/app/sitemap.ts" "src/app/blog/page.tsx"
          git add -u _scheduled 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "publish: weekly article - $SLUG"
            # the run can last ~25 min: if someone pushed to main meanwhile, rebase
            git pull --rebase origin main
            git push
          fi

      - name: Dry run result
        if: inputs.dry_run
        run: echo "::notice::dry run - ${{ steps.gen.outputs.slug || steps.topic.outputs.slug }} passed every gate, nothing was pushed"

      - name: Report failure
        if: failure()
        run: |
          echo "::error::This week's article was NOT published. Check the log:"
          echo "::error::the candidate topics were rejected (validation, fact-check or build). Nothing was pushed."
          ls -la _rejected_*.tsx 2>/dev/null && cat _rejected_*.tsx | head -60 || true
